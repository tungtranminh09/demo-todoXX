name: Zalo Mini App Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install zmp-cli
        run: npm install -g zmp-cli

      - name: Deploy to Development
        run: zmp deploy --existing
        env:
          ZMP_TOKEN: ${{ secrets.ZMP_TOKEN }}
